volumes:
  mysql-data: ~
  rabbitmq-data: ~


services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: dev
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  consumer-command:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    command: ["php", "bin/console", "messenger:consume", "command", "-vv"]
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      APP_ENV: dev
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consumer-event-stream:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    command: ["php", "bin/console", "messenger:consume", "event_stream", "-vv"]
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      APP_ENV: dev
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: main
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-33061}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sockets:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && node app.js"]
    volumes:
      - ./sockets:/app
    ports:
      - "${SOCKETS_PORT:-3001}:3001"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3001"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${APP_PORT:-8080}
      VITE_SOCKETS_URL: http://localhost:${SOCKETS_PORT:-3001}

