# DBAL only — the write side persists serialized domain events (event sourcing)
# and the read side is plain SQL projections, so the ORM would be dead weight.
doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '8.4'
        charset: utf8mb4
        profiling_collect_backtrace: '%kernel.debug%'

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test'
