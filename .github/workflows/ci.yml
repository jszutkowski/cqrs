name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: main
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/main_test?serverVersion=8.4&charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, json, pdo_mysql
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Prepare the test database
        env:
          APP_ENV: test
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: Warm the dev container (PHPStan reads it)
        run: php bin/console cache:warmup --env=dev

      # One step per gate rather than a single `composer check`, so a red build
      # names the gate that failed without opening the log. The commands
      # themselves still come from composer.json, so there is one definition of
      # how each tool runs — CI cannot drift from what you run locally.
      - name: Code style
        run: composer cs

      - name: Static analysis
        run: composer stan

      - name: Architecture rules
        run: composer arch

      - name: Tests
        run: composer test
