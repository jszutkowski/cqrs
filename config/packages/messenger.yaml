framework:
    messenger:
        failure_transport: failed

        transports:
            command:
                dsn: '%env(MESSENGER_TRANSPORT_COMMAND_DSN)%'
            event_stream:
                dsn: '%env(MESSENGER_TRANSPORT_EVENT_STREAM_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    - App\Shared\Infrastructure\Bus\TransactionMiddleware
            event.bus:
                default_middleware:
                    allow_no_handlers: true
                middleware:
                    - App\Shared\Infrastructure\Bus\TransactionMiddleware

        routing:
            App\Shared\Application\Command\Command: command
            App\Shared\Domain\EventSourcing\DomainEvent: event_stream

when@test:
    framework:
        messenger:
            # Handled inline so a functional test drives the real chain —
            # command, aggregate, event store, projection — without a worker.
            transports:
                command: 'sync://'
                event_stream: 'sync://'
                failed: 'in-memory://'
