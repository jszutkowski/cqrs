services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # The domain layer holds no services — aggregates, value objects and
            # events are constructed by application code, never by the container.
            - '../src/*/Domain/'
            - '../src/Shared/Domain/'

    Predis\ClientInterface:
        class: Predis\Client
        arguments:
            $parameters: '%env(REDIS_URL)%'

    # Names under which domain events live in the stream. Decoupled from the PHP
    # class names on purpose: renaming a class must never invalidate history.
    App\Shared\Infrastructure\EventStore\EventNameRegistry:
        arguments:
            $classesByName:
                wallet_created: 'App\Loyalty\Domain\Wallet\Event\WalletCreated'
                points_added: 'App\Loyalty\Domain\Wallet\Event\PointsAdded'
                points_withdrawn: 'App\Loyalty\Domain\Wallet\Event\PointsWithdrawn'
                points_refunded: 'App\Loyalty\Domain\Wallet\Event\PointsRefunded'
                transfer_initiated: 'App\Loyalty\Domain\Transfer\Event\TransferInitiated'
                transfer_completed: 'App\Loyalty\Domain\Transfer\Event\TransferCompleted'
                transfer_failed: 'App\Loyalty\Domain\Transfer\Event\TransferFailed'

    App\Shared\Infrastructure\EventStore\DbalEventStore:
        arguments:
            $tableName: 'events'

    App\Shared\Domain\EventSourcing\EventStore: '@App\Shared\Infrastructure\EventStore\DbalEventStore'
    App\Loyalty\Domain\Wallet\Wallets: '@App\Loyalty\Infrastructure\Repository\EventSourcedWallets'
    App\Loyalty\Domain\Transfer\Transfers: '@App\Loyalty\Infrastructure\Repository\EventSourcedTransfers'
    App\Shared\Application\Notification\Notifier: '@App\Shared\Infrastructure\Notification\RedisNotifier'
    App\Shared\Application\Command\CommandBus: '@App\Shared\Infrastructure\Bus\MessengerCommandBus'
    App\Shared\Application\Event\EventBus: '@App\Shared\Infrastructure\Bus\MessengerEventBus'
    App\Shared\Application\Event\ProcessEventBus: '@App\Shared\Infrastructure\Bus\MessengerProcessEventBus'
    App\Loyalty\Application\ReadModel\WalletReadModel: '@App\Loyalty\Infrastructure\ReadModel\DbalWalletReadModel'
    App\Loyalty\Application\ReadModel\TransferReadModel: '@App\Loyalty\Infrastructure\ReadModel\DbalTransferReadModel'
